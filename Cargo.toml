[workspace]
members = [
    "reknot_abi",
    "reknot_macros",
    "reknot",
    "examples/service_logic",
    "examples/service_host",
    "examples/typed_bot_protocol",
    "examples/typed_bot_logic",
    "examples/typed_bot_host",
    "examples/quiz_protocol",
    "examples/quiz_logic",
    "examples/quiz_host",
    "examples/threaded_io_logic",
    "examples/threaded_io_host",
    "examples/contracts_logic",
    "examples/contracts_host",
    "examples/contracts_protocol",
    "examples/db_migration_host",
    "examples/db_migration_logic",
    "examples/bevy_game_protocol",
    "examples/bevy_game_logic",
    "examples/bevy_game_host",
    "examples/tauri_tokio_logic",
    "examples/tauri_tokio/src-tauri",
]
default-members = ["reknot_abi", "reknot_macros", "reknot"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/exveria1015/reknot"
