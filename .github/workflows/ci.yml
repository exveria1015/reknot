name: Rust

on:
  push:
  pull_request:

env:
  CARGO_INCREMENTAL: '0'

defaults:
  run:
    shell: bash

jobs:
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum core Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Core feature configurations
        run: |
          cargo +1.95.0 check -p reknot_abi -p reknot_macros -p reknot --all-targets --all-features --locked
          cargo +1.95.0 check -p reknot --all-targets --no-default-features --locked

  bevy-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum Bevy Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Bevy minimum-version build
        run: cargo +1.97.1 check -p bevy_game_host -p bevy_game_logic -p bevy_game_protocol --all-targets --all-features --locked

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if apt-cache show webkitgtk-webdriver > /dev/null 2>&1; then
            task_webdriver_package=webkitgtk-webdriver
          else
            task_webdriver_package=webkit2gtk-driver
          fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev "$task_webdriver_package" xvfb
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend syntax and Tauri lints
        run: |
          node --check examples/tauri_tokio/dist/main.js
          cargo clippy -p tauri_tokio -p tauri_tokio_logic --all-targets --locked -- -D warnings
      - name: Native GUI backend integration (no window required)
        run: cargo test -p tauri_tokio --bin tauri_tokio --locked -- --ignored --test-threads=1
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.x'
      - name: Build real GUI and WebDriver
        if: runner.os == 'Linux'
        run: |
          cargo build -p tauri_tokio --locked
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Real WebView editor, Drain, Restart and recovery
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          for attempt in 1 2 3; do
            xvfb-run -a python scripts/check-gui.py --strict-transport --output "target/gui-smoke/run-$attempt"
          done
          git diff --exit-code -- examples/tauri_tokio_logic/src/lib.rs
      - name: Save GUI smoke diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gui-webview-linux
          path: target/gui-smoke/

  miri:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [Stacked, Tree]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Miri toolchain
        run: rustup toolchain install nightly-2026-11-02 --profile minimal --component miri --component rust-src
      - name: Prepare interpreter sysroot
        run: cargo +nightly-2026-11-02 miri setup --target x86_64-unknown-linux-gnu
      - name: Check task ownership, routing and generated handlers
        shell: pwsh
        run: ./scripts/check-miri.ps1 -Toolchain nightly-2026-11-02 -BorrowModel ${{ matrix.model }}
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miri-${{ matrix.model }}
          path: target/miri-audit/seed-0/

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Lockfile consistency
        run: |
          cargo metadata --format-version 1 > /dev/null
          git diff --exit-code -- Cargo.lock
      - name: Formatting
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2021 --check reknot/tests/fixtures/handler.rs reknot/tests/fixtures/abi_v5.rs reknot/tests/fixtures/reclamation.rs reknot/tests/fixtures/managed_logic.rs reknot/tests/fixtures/typed_logic.rs reknot/tests/fixtures/typed_evolution.rs reknot/tests/fixtures/cancellation_logic.rs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Public documentation links and GUI driver tests
        run: |
          python scripts/check-docs.py
          python scripts/test-check-gui.py
      - name: Extracted SDK packages and consumer
        shell: pwsh
        run: ./scripts/check-packages.ps1
      - name: Core lints (default features)
        run: cargo clippy -p reknot_abi -p reknot_macros -p reknot --all-targets --locked -- -D warnings
      - name: Core lints (all features)
        run: cargo clippy -p reknot_abi -p reknot_macros -p reknot --all-targets --all-features --locked -- -D warnings
      - name: Public API documentation
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc -p reknot_abi -p reknot_macros -p reknot --all-features --no-deps --locked
      - name: Core tests (default features)
        run: cargo test -p reknot_abi -p reknot_macros -p reknot --locked
      - name: Cache retention and separate host/cleaner processes
        run: cargo test -p reknot --test cache_lifecycle --locked -- --test-threads=1
      - name: Explicit DLL reclamation and escaped Waker return barriers
        run: cargo test -p reknot --test native_reclamation --locked -- --test-threads=1
      - name: Resident host notifications and registered generation TLS
        run: cargo test -p reknot --test native_managed_generation --locked -- --test-threads=1
      - name: Typed handlers and background save/reload
        run: |
          cargo test -p reknot --test native_typed --locked -- --ignored --test-threads=1
          cargo clippy -p typed_bot_host -p typed_bot_logic -p typed_bot_protocol --all-targets --all-features --locked -- -D warnings
          cargo test -p reknot --no-default-features --features typed --test typed_handlers --test typed_services --test typed_bridge --test typed_contracts --test typed_restart --test typed_cancellation --locked
          cargo test -p typed_bot_host --no-default-features --features static-logic --locked -- --include-ignored
          cargo run -p typed_bot_host --example framework_bridge --no-default-features --features static-logic --locked
      - name: Workspace tests without the GUI application
        run: cargo test --workspace --exclude tauri_tokio --all-features --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Axum and Fastify WebSocket quiz, live reload and recovery
        run: |
          npm ci --prefix examples/quiz_room/js --no-audit --no-fund
          cargo clippy -p quiz_host -p quiz_logic -p quiz_protocol --all-targets --locked -- -D warnings
          node --check examples/quiz_room/web/app.js
          node examples/quiz_room/check.mjs
      - name: Save quiz diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-${{ matrix.os }}
          path: target/quiz-check/
      - name: Native asynchronous I/O and multiple owner threads
        run: cargo test -p threaded_io_host --test native_threaded_io --locked -- --ignored --test-threads=1
      - name: Native multi-service contracts and typed initialization
        run: |
          cargo clippy -p contracts_host -p contracts_logic -p contracts_protocol -p threaded_io_host --all-targets --all-features --locked -- -D warnings
          cargo test -p contracts_host --test native_contracts --locked -- --ignored --test-threads=1
      - name: Host resource and SQLite migration
        run: |
          cargo clippy -p db_migration_host -p db_migration_logic --all-targets --all-features --locked -- -D warnings
          cargo test -p db_migration_host --test native_migration --locked -- --ignored --test-threads=1
      - name: Bevy game lints and native frame integration
        run: |
          cargo clippy -p bevy_game_host -p bevy_game_logic -p bevy_game_protocol --all-targets --all-features --locked -- -D warnings
          cargo test -p bevy_game_host --test native_game --locked -- --ignored --test-threads=1
      - name: Release tests and macro expansion
        run: cargo test -p reknot_abi -p reknot_macros -p reknot --release --all-features --locked
      - name: Static and native-only features
        run: |
          cargo clippy -p reknot --all-targets --no-default-features --locked -- -D warnings
          cargo test -p reknot --no-default-features --locked
          cargo clippy -p reknot --all-targets --no-default-features --features native --locked -- -D warnings
          cargo clippy -p service_host --all-targets --no-default-features --features static-logic --locked -- -D warnings
          cargo test -p service_host --release --no-default-features --features static-logic --locked
      - name: Static dependency boundary
        shell: pwsh
        run: |
          $dependencies = cargo tree -p service_host --no-default-features --features static-logic --edges normal --prefix none --format '{p}' --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect static dependency graph' }
          $forbidden = $dependencies | Select-String '^(libloading|notify|tokio|async-std|smol|libc|windows-sys) '
          if ($forbidden) { throw "Unexpected static dependencies: $forbidden" }
