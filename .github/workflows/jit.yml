name: Experimental COFF JIT

on:
  push:
    paths:
      - 'reknot/**'
      - 'reknot_abi/**'
      - 'reknot_macros/**'
      - 'native/jit/**'
      - 'scripts/*jit.ps1'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/jit.yml'
  pull_request:
    paths:
      - 'reknot/**'
      - 'reknot_abi/**'
      - 'reknot_macros/**'
      - 'native/jit/**'
      - 'scripts/*jit.ps1'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/jit.yml'

jobs:
  windows-coff:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: target/jit-deps
          key: windows-x64-llvm-23.1.0-zlib-1.3.1-zstd-1.5.7-v1
      - name: Verify and prepare local dependencies
        run: ./scripts/setup-jit.ps1
      - name: Build versioned bridge
        run: |
          ./scripts/build-jit.ps1 -LlvmRoot target/jit-deps/clang+llvm-23.1.0-x86_64-pc-windows-msvc -ZlibSource target/jit-deps/zlib-1.3.1 -ZstdSource target/jit-deps/zstd-1.5.7 -Testing
      - name: Actual COFF ownership and rejection tests
        run: |
          $env:REKNOT_JIT_BRIDGE = (Resolve-Path target/jit-bridge/Release/reknot_jit_bridge.dll).Path
          cargo test -p reknot --features jit --lib jit::tests::real_coff --locked -- --ignored --nocapture
