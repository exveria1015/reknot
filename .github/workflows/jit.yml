name: Experimental object JIT

on:
  push:
    paths:
      - 'reknot/**'
      - 'reknot_abi/**'
      - 'reknot_macros/**'
      - 'native/jit/**'
      - 'scripts/*jit*.ps1'
      - 'scripts/*elf*.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/jit.yml'
  pull_request:
    paths:
      - 'reknot/**'
      - 'reknot_abi/**'
      - 'reknot_macros/**'
      - 'native/jit/**'
      - 'scripts/*jit*.ps1'
      - 'scripts/*elf*.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/jit.yml'

jobs:
  linux-rust-elf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy
      - name: ELF inspection and relocation checks
        run: cargo test -p reknot --no-default-features --features jit-dev --lib --locked
      - name: Actual ELF loading, sealed identity, Managed collection and source watching
        run: cargo test -p reknot --no-default-features --features jit-dev --lib real_elf --locked -- --ignored --nocapture --test-threads=1
      - name: Linux loader lints and API documentation tests
        run: |
          cargo clippy -p reknot --no-default-features --features jit-dev --all-targets --locked -- -D warnings
          cargo test -p reknot --no-default-features --features jit-dev --doc --locked
  windows-rust-coff:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup toolchain install nightly-2026-11-02 --profile minimal --no-self-update
      - name: Rust loader bounds, rollback and protection
        run: cargo test -p reknot --no-default-features --features jit-dev --lib --locked
      - name: Layered development and managed physical reclamation
        run: cargo test -p reknot --release --no-default-features --features jit-dev --lib stage_de --locked -- --ignored --nocapture --test-threads=1
      - name: Managed artifact trust type boundaries
        run: cargo test -p reknot --no-default-features --features jit-dev --doc --locked
      - name: Layered COFF without LLVM
        run: |
          $env:REKNOT_JIT_TOOLCHAIN = 'nightly-2026-11-02'
          cargo test -p reknot --no-default-features --features jit --lib real_coff_rust_layered --locked -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:REKNOT_JIT_LAYERED_CRATE_TYPE = 'lib'
          $env:REKNOT_JIT_LAYERED_OPT = '0'
          $env:REKNOT_JIT_LAYERED_DEBUG = '0'
          cargo test -p reknot --no-default-features --features jit --lib real_coff_rust_layered --locked -- --ignored --nocapture
      - name: Verified build identity and safe reload
        run: cargo test -p reknot --no-default-features --features jit --lib real_coff_verified_layered_identity --locked -- --ignored --nocapture
  windows-coff:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup toolchain install nightly-2026-11-02 --profile minimal --no-self-update
      - uses: actions/cache@v4
        with:
          path: target/jit-deps
          key: windows-x64-llvm-23.1.0-zlib-1.3.1-zstd-1.5.7-v1
      - name: Verify and prepare local dependencies
        run: ./scripts/setup-jit.ps1
      - name: Build versioned bridge
        run: |
          ./scripts/build-jit.ps1 -LlvmRoot target/jit-deps/clang+llvm-23.1.0-x86_64-pc-windows-msvc -ZlibSource target/jit-deps/zlib-1.3.1 -ZstdSource target/jit-deps/zstd-1.5.7 -Testing
      - name: Actual COFF ownership, layered SDK, std, TLS and panic tests
        run: |
          $env:REKNOT_JIT_BRIDGE = (Resolve-Path target/jit-bridge/Release/reknot_jit_bridge.dll).Path
          $env:REKNOT_JIT_TOOLCHAIN = 'nightly-2026-11-02'
          $env:REKNOT_JIT_LAYERED_TOOLCHAIN = 'stable'
          cargo test -p reknot --features jit --lib real_coff --locked -- --ignored --nocapture
