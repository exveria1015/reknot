[package]
publish = false
name = "tauri_tokio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
reknot = { path = "../../../reknot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
